org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# El proyecto (D:) y la caché de pub (C:) están en discos distintos: la
# compilación incremental de Kotlin falla con "different roots" y cae a
# compilación completa con cientos de líneas de error. Desactivarla lo evita.
kotlin.incremental=false
